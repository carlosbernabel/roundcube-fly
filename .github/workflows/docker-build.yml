name: Build and Publish Roundcube

on: push: branches: - main workflow_dispatch:

permissions: contents: read

jobs: build: name: Build and publish Roundcube runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Read image version
    id: version
    run: |
      VERSION=$(cat VERSION)

      if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
        echo "Invalid image version: $VERSION"
        exit 1
      fi

      echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build image
    run: |
      docker build \
        -t ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-ubi:${{ steps.version.outputs.version }} .

  - name: Validate image
    run: |
      docker run --rm \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-ubi:${{ steps.version.outputs.version }} \
        php -v

      docker run --rm \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-ubi:${{ steps.version.outputs.version }} \
        php-fpm -t

      docker run --rm \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-ubi:${{ steps.version.outputs.version }} \
        httpd -t

  - name: Push image
    run: |
      docker push \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-ubi:${{ steps.version.outputs.version }}
