steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Read image version
    id: version
    shell: bash
    run: |
      VERSION=$(tr -d '\r\n' < VERSION)

      if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
        echo "Invalid image version: $VERSION"
        exit 1
      fi

      echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login to Red Hat Registry
    uses: docker/login-action@v3
    with:
      registry: registry.redhat.io
      username: ${{ secrets.REDHAT_USERNAME }}
      password: ${{ secrets.REDHAT_TOKEN }}

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build image
    run: |
      docker build \
        -t ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-fly:${{ steps.version.outputs.version }} .

  - name: Validate PHP
    run: |
      docker run --rm \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-fly:${{ steps.version.outputs.version }} \
        php -v

  - name: Validate PHP-FPM
    run: |
      docker run --rm \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-fly:${{ steps.version.outputs.version }} \
        php-fpm -t

  - name: Validate Apache
    run: |
      docker run --rm \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-fly:${{ steps.version.outputs.version }} \
        httpd -t

  - name: Push image
    run: |
      docker push \
        ${{ secrets.DOCKERHUB_USERNAME }}/roundcube-fly:${{ steps.version.outputs.version }}
