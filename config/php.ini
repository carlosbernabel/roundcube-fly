[PHP]

expose_php = Off

display_errors = Off
display_startup_errors = Off
log_errors = On

error_reporting = E_ALL

memory_limit = 256M

upload_max_filesize = 20M
post_max_size = 25M

max_execution_time = 120
max_input_time = 120

date.timezone = Europe/Madrid

session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

allow_url_fopen = On

